<!DOCTYPE html>
<html>

<head>
  <title>Buy_And_Sell</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Buy_And_Sell.css">
</head>

<body>
  <div class="top">
    <div class="top-1-part">
      <img class="logo" src="IITM-Logo.png" alt="logo">
      <div class="Search-class">
        <p class="search">Search for products</p>
        <img class="Search-image" src="Search-image.png" alt="search">
      </div>
      <p class="sell">Sell</p>
      <div class="Cart">
        <p>Cart</p>
        <img class="cart" src="White-cart.png" alt="cart">
      </div>
    </div>
    <div class="top-2-part">
      <p>Most Popular Items</p>
      <div>
        <img class="options" src="Bicycle.png" alt="cycle">
        <p>Cycles</p>
      </div>
      <div>
        <img class="options" src="Mattress.jpg" alt="mattress">
        <p>Mattress</p>
      </div>
      <div>
        <img class="options" src="Laptop-Stand.png" alt="mattress">
        <p>Table</p>
      </div>
    </div>
  </div>
  <div class="middle-part"></div>
  <div class="bottom-part"></div>
</body>

</html>
